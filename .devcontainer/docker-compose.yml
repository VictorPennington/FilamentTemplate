name: FilamentTemplate
services:
  app:
    image: filament-app:latest
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/var/www/html:cached
    depends_on:
      - db

  db:
    container_name: filament-db
    image: mysql:8.4.2
    environment:
      MYSQL_ROOT_PASSWORD: filament_password
      MYSQL_DATABASE: filament_db
      MYSQL_USER: filament_user
      MYSQL_PASSWORD: filament_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    container_name: filament-phpmyadmin
    image: phpmyadmin
    restart: always
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: filament_password
      UPLOAD_LIMIT: 64M      
    ports:
      - "8081:80"

volumes:
  db_data:
