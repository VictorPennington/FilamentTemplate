name: FilamentTemplate
services:
  app:
    image: filament-app:latest
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/var/www/html:cached
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "filament"
      DB_USERNAME: "filament_user"
      DB_PASSWORD: "filament_password"

  db:
    container_name: filament-db
    image: mysql:8.4.2
    entrypoint:
      sh -c "
        echo 'CREATE DATABASE IF NOT EXISTS filament; CREATE DATABASE IF NOT EXISTS test_db;' > /docker-entrypoint-initdb.d/init.sql;
        /usr/local/bin/docker-entrypoint.sh --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      "
    environment:
      MYSQL_ROOT_PASSWORD: filament_password
      MYSQL_DATABASE: filament_db
      MYSQL_USER: filament_user
      MYSQL_PASSWORD: filament_password
    ports:
      - "3312:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    container_name: filament-phpmyadmin
    image: phpmyadmin
    restart: always
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: filament_password
      UPLOAD_LIMIT: 64M      
    ports:
      - "8092:80"

volumes:
  db_data:
